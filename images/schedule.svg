<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img"><title>Calendar with checkmarks and a car for a maintenance schedule</title><rect width="900" height="300" fill="#f0fdf4"/><text x="450" y="48" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle" fill="#0b3d5c">WEEKLY - MONTHLY - SEASONAL</text><g><rect x="120" y="80" width="300" height="180" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="120" y="80" width="300" height="40" rx="12" fill="#0b3d5c"/><text x="270" y="107" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">MAINTENANCE CALENDAR</text><g font-family="Arial" font-size="22" fill="#166534"><text x="145" y="155">&#10003; Wash</text><text x="145" y="190">&#10003; Tyres</text><text x="145" y="225">&#10003; Glass</text></g><g font-family="Arial" font-size="22" fill="#0b3d5c"><text x="290" y="155">&#9744; Wax</text><text x="290" y="190">&#9744; Interior</text><text x="290" y="225">&#9744; Wipers</text></g></g><g><circle cx="620" cy="110" r="42" fill="#ffffff" stroke="#0b3d5c" stroke-width="4"/><path d="M620 82 L620 110 L642 122" stroke="#0b3d5c" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="500" y="190" width="240" height="50" rx="20" fill="#2563eb"/><rect x="530" y="165" width="180" height="35" rx="14" fill="#2563eb"/><circle cx="545" cy="245" r="20" fill="#1e293b"/><circle cx="695" cy="245" r="20" fill="#1e293b"/><circle cx="545" cy="245" r="8" fill="#cbd5e1"/><circle cx="695" cy="245" r="8" fill="#cbd5e1"/></g><text x="450" y="285" font-family="Arial" font-size="18" text-anchor="middle" fill="#475569">Tick off each task and record the date and mileage</text></svg>
