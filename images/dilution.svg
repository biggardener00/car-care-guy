<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img"><title>Wash bucket and soap bottle showing 1 to 10 dilution</title><rect width="900" height="300" fill="#eff6ff"/><text x="450" y="50" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle" fill="#0b3d5c">1 PART SOAP : 10 PARTS WATER</text><g><path d="M180 110 L200 260 L360 260 L380 110 Z" fill="#64748b"/><rect x="175" y="100" width="210" height="16" rx="8" fill="#475569"/><rect x="205" y="140" width="150" height="70" rx="8" fill="#38bdf8"/><circle cx="230" cy="90" r="14" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/><circle cx="265" cy="75" r="10" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/><text x="280" y="180" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">BUCKET</text></g><g><rect x="520" y="110" width="90" height="150" rx="10" fill="#0ea5e9"/><rect x="540" y="75" width="50" height="40" rx="6" fill="#334155"/><text x="565" y="190" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">SOAP</text><text x="565" y="215" font-family="Arial" font-size="14" text-anchor="middle" fill="#ffffff">91 ml</text></g><g><text x="680" y="150" font-family="Arial" font-size="28" font-weight="bold" fill="#0b3d5c">+</text><text x="680" y="200" font-family="Arial" font-size="22" fill="#334155">9,091 ml</text><text x="680" y="230" font-family="Arial" font-size="22" fill="#334155">water</text></g><circle cx="470" cy="90" r="16" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/><circle cx="500" cy="70" r="11" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/><text x="450" y="285" font-family="Arial" font-size="18" text-anchor="middle" fill="#475569">Measure soap first, then add water - 10 litres at 1:10</text></svg>
