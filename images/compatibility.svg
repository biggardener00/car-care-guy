<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img"><title>Clipboard checklist with ticks and crosses beside car wash bottles</title><rect width="900" height="300" fill="#fff7ed"/><text x="450" y="48" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle" fill="#0b3d5c">CHECK BEFORE YOU USE IT</text><g><rect x="140" y="75" width="280" height="195" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><rect x="240" y="62" width="80" height="26" rx="10" fill="#94a3b8"/><g font-family="Arial" font-size="24"><text x="165" y="125" fill="#166534">&#10003;</text><text x="200" y="125" fill="#334155">Label read</text><text x="165" y="165" fill="#166534">&#10003;</text><text x="200" y="165" fill="#334155">Test spot</text><text x="165" y="205" fill="#dc2626">&#10007;</text><text x="200" y="205" fill="#334155">Do not mix</text><text x="165" y="245" fill="#166534">&#10003;</text><text x="200" y="245" fill="#334155">Rinse fully</text></g></g><g><rect x="500" y="110" width="70" height="160" rx="10" fill="#0ea5e9"/><rect x="515" y="80" width="40" height="35" rx="6" fill="#334155"/><text x="535" y="190" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">SOAP</text><rect x="590" y="130" width="70" height="140" rx="10" fill="#f59e0b"/><rect x="605" y="100" width="40" height="35" rx="6" fill="#334155"/><text x="625" y="200" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">WHEEL</text><rect x="680" y="150" width="70" height="120" rx="10" fill="#22c55e"/><rect x="695" y="120" width="40" height="35" rx="6" fill="#334155"/><text x="715" y="215" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">GLASS</text></g><text x="450" y="290" font-family="Arial" font-size="18" text-anchor="middle" fill="#475569">If the label does not say it is safe, do not use it there</text></svg>
