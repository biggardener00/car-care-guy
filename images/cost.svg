<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img"><title>Calculator and coins showing detailing costs</title><rect width="900" height="300" fill="#fefce8"/><text x="450" y="50" font-family="Arial" font-size="34" font-weight="bold" text-anchor="middle" fill="#0b3d5c">COST PER WASH = TOTAL / WASHES</text><g><rect x="150" y="90" width="200" height="170" rx="14" fill="#334155"/><rect x="170" y="110" width="160" height="45" rx="6" fill="#e2e8f0"/><text x="250" y="140" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#0f172a">$6.25</text><g fill="#f8fafc"><rect x="170" y="170" width="45" height="30" rx="5"/><rect x="227" y="170" width="45" height="30" rx="5"/><rect x="285" y="170" width="45" height="30" rx="5"/><rect x="170" y="212" width="45" height="30" rx="5"/><rect x="227" y="212" width="45" height="30" rx="5"/><rect x="285" y="212" width="45" height="30" rx="5"/></g></g><g><circle cx="520" cy="170" r="55" fill="#facc15" stroke="#a16207" stroke-width="4"/><text x="520" y="182" font-family="Arial" font-size="48" font-weight="bold" text-anchor="middle" fill="#713f12">$</text><circle cx="620" cy="200" r="42" fill="#facc15" stroke="#a16207" stroke-width="4"/><text x="620" y="210" font-family="Arial" font-size="36" font-weight="bold" text-anchor="middle" fill="#713f12">$</text></g><g><rect x="680" y="140" width="150" height="50" rx="20" fill="#2563eb"/><rect x="700" y="115" width="110" height="35" rx="14" fill="#2563eb"/><circle cx="715" cy="195" r="20" fill="#1e293b"/><circle cx="795" cy="195" r="20" fill="#1e293b"/><circle cx="715" cy="195" r="8" fill="#cbd5e1"/><circle cx="795" cy="195" r="8" fill="#cbd5e1"/></g><text x="450" y="285" font-family="Arial" font-size="18" text-anchor="middle" fill="#475569">Example: $150 a year / 24 washes = $6.25 per wash</text></svg>
